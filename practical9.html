<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CM25118</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden">

        <div class="bg-teal-700 p-6 text-white">

            <h1 class="text-3xl font-bold">
                Personal To-Do List
            </h1>

            <p class="mt-2 text-teal-100">
                Organize your daily academic and personal tasks
            </p>

        </div>

        <div class="p-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

                <div class="bg-teal-50 rounded-xl p-4 text-center">
                    <h3 class="text-sm text-slate-500">Total Tasks</h3>
                    <p id="totalTasks" class="text-3xl font-bold text-teal-700">0</p>
                </div>

                <div class="bg-emerald-50 rounded-xl p-4 text-center">
                    <h3 class="text-sm text-slate-500">Completed</h3>
                    <p id="completedTasks" class="text-3xl font-bold text-emerald-700">0</p>
                </div>

                <div class="bg-amber-50 rounded-xl p-4 text-center">
                    <h3 class="text-sm text-slate-500">Pending</h3>
                    <p id="pendingTasks" class="text-3xl font-bold text-amber-700">0</p>
                </div>

            </div>

            <div class="flex flex-col md:flex-row gap-3 mb-6">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
                >

                <button
                    id="addTaskBtn"
                    class="bg-teal-700 hover:bg-teal-800 text-white px-6 py-3 rounded-xl font-medium transition duration-300"
                >
                    Add Task
                </button>

            </div>

            <div>

                <h2 class="text-xl font-semibold text-slate-700 mb-4">
                    My Tasks
                </h2>

                <ul id="taskList" class="space-y-3"></ul>

                <div
                    id="emptyMessage"
                    class="text-center text-slate-400 py-10"
                >
                    No tasks added yet.
                </div>

            </div>

        </div>

    </div>

<script>

const taskInput = document.getElementById("taskInput");
const addTaskBtn = document.getElementById("addTaskBtn");
const taskList = document.getElementById("taskList");

const totalTasks = document.getElementById("totalTasks");
const completedTasks = document.getElementById("completedTasks");
const pendingTasks = document.getElementById("pendingTasks");

const emptyMessage = document.getElementById("emptyMessage");

function updateStats() {

    const allTasks = taskList.children.length;

    let completed = 0;

    document.querySelectorAll(".task-checkbox").forEach((checkbox) => {
        if (checkbox.checked) {
            completed++;
        }
    });

    totalTasks.textContent = allTasks;
    completedTasks.textContent = completed;
    pendingTasks.textContent = allTasks - completed;

    if (allTasks === 0) {
        emptyMessage.classList.remove("hidden");
    } else {
        emptyMessage.classList.add("hidden");
    }
}

function addTask() {

    const taskText = taskInput.value.trim();

    if (taskText === "") {
        alert("Please enter a task!");
        return;
    }

    const li = document.createElement("li");

    li.className =
        "bg-white border border-slate-200 border-l-4 border-teal-600 rounded-xl p-4 flex items-center justify-between hover:shadow-md transition duration-300";

    const leftSection = document.createElement("div");
    leftSection.className = "flex items-center gap-3";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className =
        "task-checkbox w-5 h-5 accent-emerald-600 cursor-pointer";

    const taskTextElement = document.createElement("span");
    taskTextElement.textContent = taskText;
    taskTextElement.className =
        "text-slate-700 font-medium";

    checkbox.addEventListener("change", () => {

        taskTextElement.classList.toggle("line-through");
        taskTextElement.classList.toggle("text-slate-400");

        if (checkbox.checked) {

            li.classList.add("bg-emerald-50");
            li.classList.add("border-emerald-500");

        } else {

            li.classList.remove("bg-emerald-50");
            li.classList.remove("border-emerald-500");

        }

        updateStats();
    });

    leftSection.appendChild(checkbox);
    leftSection.appendChild(taskTextElement);

    const deleteBtn = document.createElement("button");

    deleteBtn.textContent = "Delete";

    deleteBtn.className =
        "bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition";

    deleteBtn.addEventListener("click", () => {
        li.remove();
        updateStats();
    });

    li.appendChild(leftSection);
    li.appendChild(deleteBtn);

    taskList.appendChild(li);

    taskInput.value = "";
    taskInput.focus();

    updateStats();
}

addTaskBtn.addEventListener("click", addTask);

taskInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        addTask();
    }
});

updateStats();

</script>

</body>
</html>
