<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<title>CM25118</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#ede9fe);
    overflow:hidden;
}
body:before,body:after{
    content:"";
    position:fixed;
    width:150px;
    height:150px;
    border-radius:30%;
    background:#6366f1;
    opacity:.25;
    animation:float 5s infinite alternate;
}
body:before{top:8%;left:8%}
body:after{bottom:8%;right:8%;animation-delay:2s}

@keyframes float{
    to{transform:translateY(-35px) rotate(25deg)}
}

.card{
    width:420px;
    padding:30px;
    border-radius:22px;
    background:rgba(255,255,255,.9);
    box-shadow:0 25px 50px #0003;
    transform-style:preserve-3d;
    animation:show 1s ease;
}

@keyframes show{
    from{opacity:0;transform:rotateX(20deg) translateY(50px)}
    to{opacity:1;transform:rotateX(0) translateY(0)}
}

h2{
    text-align:center;
    color:#3730a3;
    margin-bottom:25px;
}

label{
    display:block;
    margin:13px 0 6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:9px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#6366f1;
    transform:translateY(-2px);
    box-shadow:0 5px 15px #6366f133;
}

.valid{border-color:#16a34a!important}
.invalid{border-color:#dc2626!important}

.error{
    color:#dc2626;
    font-size:12px;
    height:17px;
}

.password{
    display:flex;
    gap:6px;
}

.password input{flex:1}

.show{
    border:0;
    border-radius:8px;
    background:#e0e7ff;
    color:#3730a3;
    padding:0 10px;
    cursor:pointer;
}

.strength{
    height:6px;
    background:#ddd;
    margin-top:6px;
    border-radius:10px;
}

#bar{
    height:100%;
    width:0;
    border-radius:10px;
    transition:.4s;
}

button.submit{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:9px;
    color:white;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    box-shadow:0 6px 0 #312e81;
    cursor:pointer;
    transition:.2s;
}

button.submit:hover{
    transform:translateY(-3px);
}

button.submit:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #312e81;
}

#success{
    display:none;
    text-align:center;
}

.tick{
    font-size:60px;
    color:#16a34a;
    animation:pop .6s ease;
}

@keyframes pop{
    from{transform:scale(0)}
    to{transform:scale(1)}
}

@media(max-width:480px){
    .card{width:90%;padding:25px}
}
</style>
</head>

<body>

<div class="card">

<div id="formBox">

<h2>🎓 Student Registration</h2>

<form id="form">

<label>Full Name</label>
<input id="name" placeholder="Enter your name">
<div class="error" id="nameErr"></div>

<label>Email</label>
<input id="email" placeholder="Enter your email">
<div class="error" id="emailErr"></div>

<label>Mobile Number</label>
<input id="mobile" maxlength="10"
       placeholder="10 digit mobile number">
<div class="error" id="mobileErr"></div>

<label>Password</label>

<div class="password">
<input type="password" id="pass"
       placeholder="Minimum 8 characters">
<button type="button" class="show"
        id="show">Show</button>
</div>

<div class="strength">
<div id="bar"></div>
</div>

<div class="error" id="passErr"></div>

<label>Confirm Password</label>
<input type="password" id="confirm"
       placeholder="Re-enter password">
<div class="error" id="confirmErr"></div>

<button class="submit" type="submit">
Register Student
</button>

</form>
</div>


<div id="success">

<div class="tick">✓</div>

<h2>Registration Successful!</h2>

<p>Your details are valid.</p>

<button class="submit" onclick="location.reload()">
Register Again
</button>

</div>

</div>


<script>

let form=document.getElementById("form");

let name=document.getElementById("name");
let email=document.getElementById("email");
let mobile=document.getElementById("mobile");
let pass=document.getElementById("pass");
let confirm=document.getElementById("confirm");

function error(input,id,msg){

    document.getElementById(id).innerText=msg;

    input.classList.toggle("invalid",msg!="");
    input.classList.toggle("valid",msg=="");

    return msg=="";
}

mobile.oninput=()=>{
    mobile.value=mobile.value.replace(/\D/g,"");
};

pass.oninput=()=>{

    let score=0;

    if(pass.value.length>=8)score++;
    if(/[A-Z]/.test(pass.value))score++;
    if(/[a-z]/.test(pass.value))score++;
    if(/[0-9]/.test(pass.value))score++;

    document.getElementById("bar").style.width=
        score*25+"%";

    document.getElementById("bar").style.background=
        score<2?"#ef4444":
        score<4?"#f59e0b":"#22c55e";
};

document.getElementById("show").onclick=()=>{

    pass.type=pass.type=="password"?"text":"password";

    document.getElementById("show").innerText=
        pass.type=="password"?"Show":"Hide";
};

form.onsubmit=(e)=>{

    e.preventDefault();

    let ok=true;

    if(!name.value.trim())
        ok=error(name,"nameErr","Name is required.")&&ok;
    else
        error(name,"nameErr","");

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value))
        ok=error(email,"emailErr","Enter valid email.")&&ok;
    else
        error(email,"emailErr","");

    if(!/^[6-9]\d{9}$/.test(mobile.value))
        ok=error(mobile,"mobileErr","Enter valid 10 digit number.")&&ok;
    else
        error(mobile,"mobileErr","");

    if(pass.value.length<8)
        ok=error(pass,"passErr","Minimum 8 characters.")&&ok;
    else
        error(pass,"passErr","");

    if(confirm.value!==pass.value)
        ok=error(confirm,"confirmErr","Passwords do not match.")&&ok;
    else
        error(confirm,"confirmErr","");

    if(ok){

        document.getElementById("formBox").style.display="none";
        document.getElementById("success").style.display="block";
    }
};

</script>

</body>
</html>
